[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "packt-qml-listings"
version = "0.1.0"
description = "Companion code for Quantum Machine Learning in Practice"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = [
    "numpy==2.0.2",
    "scipy==1.17.1",
    "pandas==2.3.3",
    "scikit-learn==1.8.0",
    "matplotlib==3.10.9",
    "seaborn>=0.13,<0.14",
    "jupyterlab>=4.4,<5",
    "ipykernel==7.2.0",
    "nbconvert>=7.16,<8",
    "nbclient>=0.10,<0.11",
    "tqdm==4.68.2",
]

[project.optional-dependencies]
pennylane = [
    "pennylane==0.45.0",
    "pennylane-lightning==0.45.0",
    "autograd==1.8.0",
    "torch==2.12.0",
]
qiskit = [
    "qiskit==2.4.1",
    "qiskit-aer==0.17.2",
    "qiskit-machine-learning==0.9.0",
]
cirq = [
    "cirq-core==1.5.0",
    "cirq-google==1.5.0",
    "sympy==1.14.0",
]
tfq = [
    "tensorflow==2.18.1; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "tf-keras==2.18.0; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "tensorflow-quantum[and-tensorflow]==0.7.6; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "cirq-google==1.5.0; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "cirq-core==1.5.0; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "jax==0.5.3; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "jaxlib==0.5.3; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sympy==1.14.0; sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv]
required-version = ">=0.12.3"

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
